name: Loan Approval MLOps CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare CI dataset
        run: |
          mkdir -p data/raw
          cp data/ci/loan_data.csv data/raw/loan_data.csv

      - name: Reproduce DVC pipeline
        run: dvc repro

      - name: Run tests
        run: pytest -v

      - name: Run coverage
        run: pytest -v --cov=src --cov=app --cov-report=term-missing

      - name: Build Docker image
        run: docker build -t loan-approval-mlops:ci .
